name: SkyCastle AFK 挂机

on:
  schedule:
    # Offset from the main workflow so AFK doesn't collide on the 60s work lock.
    - cron: "50 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "挂机分钟数（默认只跑10次）"
        required: false
        default: "10"

concurrency:
  group: skycastle-afk-${{ github.repository }}
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
          restore-keys: |
            skycastle-token-${{ github.repository }}-
      - name: Desktop AFK
        env:
          SKYCASTLE_PANEL: ${{ secrets.SKYCASTLE_PANEL || 'https://panel.skycastle.us' }}
          SKYCASTLE_EMAIL: ${{ secrets.SKYCASTLE_EMAIL }}
          SKYCASTLE_USERNAME: ${{ secrets.SKYCASTLE_USERNAME }}
          SKYCASTLE_PASSWORD: ${{ secrets.SKYCASTLE_PASSWORD }}
          SKYCASTLE_TOTP: ${{ secrets.SKYCASTLE_TOTP }}
          SKYCASTLE_TOKEN: ${{ secrets.SKYCASTLE_TOKEN }}
          SKYCASTLE_ACCOUNTS: ${{ secrets.SKYCASTLE_ACCOUNTS }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          SKYCASTLE_TURNSTILE_SITEKEY: ${{ secrets.SKYCASTLE_TURNSTILE_SITEKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SKYCASTLE_MODE: afk
          SKYCASTLE_AFK_MINUTES: ${{ github.event.inputs.minutes || '10' }}
          PYTHONUNBUFFERED: "1"
        run: python -u skycastle.py afk
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
