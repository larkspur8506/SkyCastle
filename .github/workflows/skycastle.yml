name: SkyCastle Renew + AFK

on:
  #schedule:
    # Every 6 hours. GitHub cron is UTC.
    #- cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = 续期 + 桌面 AFK；renew 只续期；afk 桌面挂机；status 只查询"
        required: true
        default: all
        type: choice
        options: [all, renew, afk, status, login]
      minutes:
        description: "AFK 分钟数（默认只跑10次）"
        required: false
        default: "10"
      panel:
        description: "面板地址"
        required: false
        default: "https://panel.skycastle.us"

concurrency:
  group: skycastle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SeleniumBase UC (Cloudflare Turnstile bypass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          pip install --quiet seleniumbase
          # chromedriver 与镜像自带 Chrome 严格对齐（2026-11-15：镜像 Chrome=157.0.8103.50，
          # 而 "Latest Stable" driver=157.0.8103.78，小版本错位导致 Chrome 在 UC 重连时崩溃）
          CV=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          echo "installed Chrome: $CV"
          URL=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json | \
            CV="$CV" python3 -c "import json,os,sys; v=os.environ['CV']; ms=[x for x in json.load(sys.stdin)['versions'] if x['version']==v]; ds=[u['url'] for u in ms[-1]['downloads'].get('chromedriver',[]) if u['platform']=='linux64'] if ms else []; print(ds[0] if ds else '')")
          if [ -n "$URL" ]; then
            wget -qO /tmp/cd.zip "$URL"
            unzip -o -q /tmp/cd.zip -d /tmp/cd
            SB_DRIVERS=$(python3 -c "import seleniumbase, os; print(os.path.join(os.path.dirname(seleniumbase.__file__),'drivers'))")
            cp /tmp/cd/chromedriver-linux64/chromedriver "$SB_DRIVERS/chromedriver"
            chmod +x "$SB_DRIVERS/chromedriver"
            echo "chromedriver pinned to $URL"
          else
            echo "CfT 无匹配版本，回退 Latest Stable"
            seleniumbase get chromedriver || true
          fi

      - name: Restore remember_token cache
        uses: actions/cache@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
          restore-keys: |
            skycastle-token-${{ github.repository }}-

      - name: Run CastleKeep
        env:
          SKYCASTLE_PANEL: ${{ github.event.inputs.panel || secrets.SKYCASTLE_PANEL || 'https://panel.skycastle.us' }}
          SKYCASTLE_EMAIL: ${{ secrets.SKYCASTLE_EMAIL }}
          SKYCASTLE_USERNAME: ${{ secrets.SKYCASTLE_USERNAME }}
          SKYCASTLE_PASSWORD: ${{ secrets.SKYCASTLE_PASSWORD }}
          SKYCASTLE_TOTP: ${{ secrets.SKYCASTLE_TOTP }}
          SKYCASTLE_TOKEN: ${{ secrets.SKYCASTLE_TOKEN }}
          SKYCASTLE_REMEMBER_TOKEN: ${{ secrets.SKYCASTLE_REMEMBER_TOKEN }}
          SKYCASTLE_ACCOUNTS: ${{ secrets.SKYCASTLE_ACCOUNTS }}
          SKYCASTLE_PLAN_ID: ${{ secrets.SKYCASTLE_PLAN_ID }}
          SKYCASTLE_COUPON: ${{ secrets.SKYCASTLE_COUPON }}
          SKYCASTLE_START_SERVERS: ${{ secrets.SKYCASTLE_START_SERVERS || '1' }}
          SKYCASTLE_SERVER_RENEW: ${{ secrets.SKYCASTLE_SERVER_RENEW || '1' }}
          SKYCASTLE_RESTART_SERVERS: ${{ secrets.SKYCASTLE_RESTART_SERVERS || '1' }}
          SKYCASTLE_TG_SCREENSHOT: ${{ secrets.SKYCASTLE_TG_SCREENSHOT || '1' }}
          SKYCASTLE_SCREENSHOT_PATH: ${{ secrets.SKYCASTLE_SCREENSHOT_PATH || '/dashboard/servers' }}
          SKYCASTLE_TURNSTILE_SITEKEY: ${{ secrets.SKYCASTLE_TURNSTILE_SITEKEY }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SKYCASTLE_MODE: ${{ github.event.inputs.mode || 'all' }}
          SKYCASTLE_AFK_MINUTES: ${{ github.event.inputs.minutes || '10' }}
          PYTHONUNBUFFERED: "1"
          # uc_gui_click_captcha needs a display
          DISPLAY: ":99"
        run: xvfb-run -a python -u skycastle.py

      - name: Keep cache even if job failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
