name: SkyCastle Renew + AFK

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = 续期 + 桌面 AFK；renew 只续期；afk 桌面挂机；status 只查询"
        required: true
        default: all
        type: choice
        options: [all, renew, afk, status, login]
      minutes:
        description: "AFK 分钟数（默认只跑10次）"
        required: false
        default: "10"
      panel:
        description: "面板地址"
        required: false
        default: "https://panel.skycastle.us"

concurrency:
  group: skycastle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore remember_token cache
        uses: actions/cache@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
          restore-keys: |
            skycastle-token-${{ github.repository }}-

      - name: Run CastleKeep
        env:
          SKYCASTLE_PANEL: ${{ github.event.inputs.panel || secrets.SKYCASTLE_PANEL || 'https://panel.skycastle.us' }}
          SKYCASTLE_EMAIL: ${{ secrets.SKYCASTLE_EMAIL }}
          SKYCASTLE_USERNAME: ${{ secrets.SKYCASTLE_USERNAME }}
          SKYCASTLE_PASSWORD: ${{ secrets.SKYCASTLE_PASSWORD }}
          SKYCASTLE_TOTP: ${{ secrets.SKYCASTLE_TOTP }}
          SKYCASTLE_TOKEN: ${{ secrets.SKYCASTLE_TOKEN }}
          SKYCASTLE_REMEMBER_TOKEN: ${{ secrets.SKYCASTLE_REMEMBER_TOKEN }}
          SKYCASTLE_ACCOUNTS: ${{ secrets.SKYCASTLE_ACCOUNTS }}
          SKYCASTLE_PLAN_ID: ${{ secrets.SKYCASTLE_PLAN_ID }}
          SKYCASTLE_COUPON: ${{ secrets.SKYCASTLE_COUPON }}
          SKYCASTLE_START_SERVERS: ${{ secrets.SKYCASTLE_START_SERVERS || '1' }}
          SKYCASTLE_TURNSTILE_SITEKEY: ${{ secrets.SKYCASTLE_TURNSTILE_SITEKEY }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SKYCASTLE_MODE: ${{ github.event.inputs.mode || 'all' }}
          SKYCASTLE_AFK_MINUTES: ${{ github.event.inputs.minutes || '10' }}
          PYTHONUNBUFFERED: "1"
        run: python -u skycastle.py

      - name: Keep cache even if job failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .skycastle-cache
          key: skycastle-token-${{ github.repository }}-v1
